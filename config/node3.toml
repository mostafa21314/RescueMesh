# Lab topology (two machines for now): node1 and node2 on MACHINE_A, node3 on MACHINE_B.
# Fill in the IPs with scripts/set_ips.sh (or .ps1) A_IP B_IP; to move node2 to a
# third machine, re-run it with C_IP as well. See docs/deployment.md.
node_id = 3
listen = "0.0.0.0:7003"
peers = [
  { id = 1, addr = "MACHINE_A_IP:7001" },
  { id = 2, addr = "MACHINE_A_IP:7002" },
]

# Election.
election_mode = "on_demand"     # or "per_request"
policy = "Composite"            # Composite | QueueOnly | CpuOnly | RoundRobin
weights = { pending = 0.5, cpu = 0.3, service_time = 0.2 }
bid_timeout_ms = 100
degraded_after_ms = 3000
min_tenure_ms = 1000            # retries trigger elections only after the server held the role this long (= client timeout)
cpu_source = "machine"          # CPU term: "machine" (whole machine) or "process" (this node only)

# Processing.
workers = 4                     # planner threads
seed = 42                       # synthetic campus; must match on every node
queue_capacity = 64             # queued jobs before replying Busy
table_ttl_ms = 1800000          # request/results table entry lifetime (30 min, D38)

# Recovery after a temporary failure or a restart (docs/recovery.md, "Final choices").
# full / locked / both_agree / on_start = false is the original protocol.
[recovery]
transfer = "delta"              # full | delta: delta pulls only what changed while away
snapshot = "chunked"            # locked | chunked: chunked holds the state lock per 64 records
ready_rule = "majority"         # both_agree | majority: majority resumes with one survivor
on_start = true                 # at start, probe the peers; if the cluster is running, recover before serving
delta_margin_ms = 2000
majority_wait_ms = 500

[scheduling]
policy = "priority_decay"
priority_boost_ms = 250
priority_half_life_ms = 1000
request_lease_ms = 10000
